<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBB Hype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: navy scoreboard bar + tab strip on top; each view is a stack of panels on an auto-fit grid that drops to one column near 400px. */
:root {
  --bg: #f2f3f5;
  --panel: #ffffff;
  --ink: #141a24;
  --muted: #5a6372;
  --line: #dde1e7;
  --bar: #1f3864;
  --bar-ink: #ffffff;
  --accent: #1f4fa0;
  --accent-soft: #e5ecf8;
  --pos: #2a78d6;
  --neg: #e34948;
  --dot: #c3c8d0;
  --good: #0b6e0b; --good-bg: #dcf1dc;
  --bad: #ad2222;  --bad-bg: #fbe0e0;
  --even: #59606b; --even-bg: #eceef1;
  --warn: #7a4a00; --warn-bg: #fde9c4;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --panel: #1a1d22; --ink: #eceef1; --muted: #a2a9b4; --line: #2d3239;
    --bar: #0c1730; --bar-ink: #eef2fa; --accent: #8db0ec; --accent-soft: #1d2a42;
    --pos: #3987e5; --neg: #e66767; --dot: #474d57;
    --good: #6fd56f; --good-bg: #173019; --bad: #ff8e8e; --bad-bg: #3b1d1d; --even: #b0b6bf; --even-bg: #2a2e34;
    --warn: #ffc56b; --warn-bg: #3a2a10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --panel: #1a1d22; --ink: #eceef1; --muted: #a2a9b4; --line: #2d3239;
  --bar: #0c1730; --bar-ink: #eef2fa; --accent: #8db0ec; --accent-soft: #1d2a42;
  --pos: #3987e5; --neg: #e66767; --dot: #474d57;
  --good: #6fd56f; --good-bg: #173019; --bad: #ff8e8e; --bad-bg: #3b1d1d; --even: #b0b6bf; --even-bg: #2a2e34;
  --warn: #ffc56b; --warn-bg: #3a2a10;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Top bar */
.top { background: var(--bar); color: var(--bar-ink); padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.brand { font: 700 26px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.brand span { opacity: .65; font-weight: 500; }
.fileinfo { font-size: 12.5px; opacity: .85; flex: 1 1 260px; }
.fileinfo b { font-weight: 600; }
.runinfo { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.runinfo a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.stale { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 99px; background: #fab219; color: #241a00; font-weight: 600; font-size: 11.5px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn-bar { background: transparent; color: var(--bar-ink); border-color: rgba(255,255,255,.4); }
.btn-bar:hover { border-color: var(--bar-ink); }

.tabs { display: flex; gap: 2px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; position: sticky; top: 0; z-index: 5; }
.tabs a { padding: 11px 12px 9px; text-decoration: none; color: var(--muted); font: 600 15px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding: 16px 20px 40px; max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.panel h2 { font: 700 20px/1.1 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 0 0 4px; text-wrap: balance; }
.panel h3 { font: 600 16px/1.2 var(--display); letter-spacing: .03em; text-transform: uppercase; margin: 0 0 8px; color: var(--muted); }
.sub { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 12px; }
.controls label { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
input[type="date"], input[type="search"], input[type="number"], select { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 8px; }
input[type="search"] { min-width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* Drop zone / empty state */
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 40px 24px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.drop h2 { font-size: 30px; }
.drop p { max-width: 60ch; margin: 0; color: var(--muted); }
.drop ul { text-align: left; color: var(--muted); margin: 4px 0 0; padding-left: 20px; max-width: 60ch; }
.overlay { position: fixed; inset: 0; background: rgba(15,30,60,.55); color: #fff; display: none; place-items: center; z-index: 50; font: 700 34px var(--display); text-transform: uppercase; letter-spacing: .03em; }
.overlay.on { display: grid; }
.error { color: var(--bad); background: var(--bad-bg); padding: 10px 12px; border-radius: 8px; }

/* Game cards */
.games { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.game { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; cursor: pointer; background: var(--panel); }
.game:hover { border-color: var(--accent); }
.g-top { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.g-top .time { font-weight: 600; color: var(--ink); margin-right: auto; }
.tag { border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; font-size: 11.5px; }
.g-team { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; }
.rk { font-size: 11.5px; color: var(--muted); text-align: right; }
.tname { font-weight: 500; }
.g-team .cf { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 4px; }
.score { font: 700 22px/1 var(--display); min-width: 2ch; text-align: right; }
.g-team.win .tname, .g-team.win .score { font-weight: 700; }
.g-team.loss .score { color: var(--muted); font-weight: 500; }
.g-lines { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; margin: 0; }
.g-lines div { min-width: 0; }
.g-lines dt { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.g-lines dd { margin: 0; font-weight: 500; font-size: 13px; overflow-wrap: anywhere; }
.g-lines dd small { color: var(--muted); font-weight: 400; }
.g-res { display: flex; gap: 6px; flex-wrap: wrap; }
.linkish { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: inherit; font: inherit; }
.linkish:hover { color: var(--accent); text-decoration: underline; }

.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.even { background: var(--even-bg); color: var(--even); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }

/* Tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; max-height: 70vh; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--panel); z-index: 1; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
th button { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; }
th button:hover { color: var(--ink); }
th[aria-sort] button { color: var(--ink); }
td.r, th.r { text-align: right; }
tbody tr:hover { background: var(--accent-soft); }
tbody tr.click { cursor: pointer; }
.muted { color: var(--muted); }

/* Team profile */
.t-head { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; margin-bottom: 14px; }
.t-head h2 { font-size: 34px; margin: 0; }
.t-head .meta { color: var(--muted); }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); margin-bottom: 4px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tile .v { font: 700 28px/1.1 var(--display); }
.tile .s { font-size: 12px; color: var(--muted); }
.bars { display: grid; gap: 9px; }
.pbar { display: grid; grid-template-columns: 120px 1fr 92px; gap: 10px; align-items: center; font-size: 13px; }
.pbar .track { height: 10px; background: var(--even-bg); border-radius: 99px; position: relative; overflow: hidden; }
.pbar .fill { position: absolute; inset: 0 auto 0 0; background: var(--pos); border-radius: 99px; }
.pbar .val { text-align: right; }
.pbar .val small { color: var(--muted); }
.splits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kv { display: grid; gap: 6px; }
.kv div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.kv span:first-child { color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.legend i { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart { width: 100%; }
.chart svg { display: block; overflow: visible; }
.chart text { fill: var(--muted); font: 11px var(--body); }
.chart .grid line { stroke: var(--line); }
.chart .zero { stroke: var(--muted); stroke-width: 1; }

/* Matchup */
.cmp { display: grid; grid-template-columns: 1fr minmax(90px, auto) 1fr; gap: 0; font-variant-numeric: tabular-nums; }
.cmp > div { padding: 7px 8px; border-bottom: 1px solid var(--line); }
.cmp .lab { text-align: center; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.cmp .a { text-align: right; }
.cmp .better { font-weight: 700; color: var(--accent); }
.cmp .hd { font: 700 22px/1.1 var(--display); text-transform: uppercase; border-bottom: 2px solid var(--line); }
.callout { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
.callout b { font: 700 22px/1.1 var(--display); }

.tip { position: fixed; z-index: 60; display: none; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.18); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; max-width: 280px; }
.tip .tip-h { font-weight: 600; margin-bottom: 2px; }

/* Model */
.pill.edge { background: var(--accent-soft); color: var(--accent); }
.ebar { display: inline-block; width: 46px; height: 6px; border-radius: 99px; background: var(--even-bg); margin-left: 6px; vertical-align: 1px; position: relative; overflow: hidden; }
.ebar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
.wp { display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 2px; margin: 6px 0 2px; }
.wp span { display: block; height: 100%; }
.wp-l { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.score-board { display: grid; gap: 2px; }
.sb-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 600 26px/1.15 var(--display); text-transform: uppercase; color: var(--muted); }
.sb-row.fav { color: var(--ink); font-weight: 700; }
.sb-name { min-width: 0; overflow-wrap: anywhere; }
.edges { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 12px; }
.edges .tile .v { font-size: 22px; }
details.settings { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
details.settings summary { cursor: pointer; font-weight: 600; }
details.settings .controls { margin: 10px 0 0; }
details.settings input { width: 72px; }
.fm { display: grid; grid-template-columns: 1fr auto 1fr; gap: 4px 10px; align-items: center; font-size: 13px; }
.fm .lab { text-align: center; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
.fm .a { text-align: right; }
.fm .hd { font: 700 16px/1.2 var(--display); text-transform: uppercase; padding-top: 8px; color: var(--ink); grid-column: 1 / -1; text-align: left; border-bottom: 1px solid var(--line); }
.cmp .note, .fm .note { color: var(--muted); font-size: 11.5px; }
.better-ats { font-weight: 700; color: var(--good); }

/* Picks */
.picks { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.pick { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; cursor: pointer; background: var(--panel); }
.pick:hover { border-color: var(--accent); }
.pick.strong { border-left-color: var(--good); }
.pick.flagged { border-left-color: var(--warn); }
.pick .flag { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; }
.pick .note { color: var(--muted); font-size: 12px; font-style: italic; }
.rosters { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); }
.pick .p-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.pick .p-top .pill { margin-right: auto; }
.pick .p-main { font: 700 26px/1.1 var(--display); text-transform: uppercase; }
.pick .p-conf { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.pick ul { margin: 2px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; display: grid; gap: 2px; }
.trust { height: 8px; background: var(--even-bg); border-radius: 99px; overflow: hidden; margin: 6px 0 4px; }
.trust i { display: block; height: 100%; background: var(--accent); }

@media (max-width: 560px) {
  .top { padding: 10px 16px; }
  main { padding: 12px 16px 32px; }
  .pbar { grid-template-columns: 92px 1fr 78px; }
  .splits { grid-template-columns: 1fr; }
  input[type="search"] { min-width: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">CBB <span>Hype</span></h1>
  <div class="fileinfo" id="fileinfo">No workbook loaded yet.</div>
  <button class="btn btn-bar" id="loadBtn" type="button">Load workbook</button>
  <input id="fileInput" type="file" accept=".xlsx,.xlsm,.xls" multiple hidden>
</header>
<nav class="tabs" id="tabs" aria-label="Views">
  <a href="#picks" data-view="picks">Picks</a>
  <a href="#games" data-view="games">Games</a>
  <a href="#model" data-view="model">Model board</a>
  <a href="#team" data-view="team">Team lookup</a>
  <a href="#matchup" data-view="matchup">Matchup</a>
  <a href="#rankings" data-view="rankings">Rankings</a>
  <a href="#conferences" data-view="conferences">Conferences</a>
  <a href="#ats" data-view="ats">ATS &amp; totals</a>
</nav>
<main id="main"></main>
<div class="overlay" id="overlay">Drop the workbook to load it</div>

<!--WORKBOOK-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ---------------------------------------------------------------- helpers */
const $ = s => document.querySelector(s);
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "text") e.textContent = v;
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k) e.append(k);
  return e;
}
const num = v => { if (v == null || v === "") return null; const n = typeof v === "number" ? v : Number(String(v).replace(/[^0-9.+-]/g, "")); return Number.isFinite(n) ? n : null; };
const str = v => (v == null || v === "") ? null : String(v).trim();
const DASH = "—";
const f1 = v => v == null ? DASH : v.toFixed(1);
const fs1 = v => v == null ? DASH : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1);
const fpct0 = v => v == null ? DASH : Math.round(v * 100) + "%";
const fwp = v => v == null ? DASH : v.toFixed(3).replace(/^0/, "");
const fspread = v => v == null ? DASH : v === 0 ? "PK" : (v > 0 ? "+" : "−") + Math.abs(v).toFixed(1);
const avg = (...xs) => { const v = xs.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`;

function todayET() {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  return p; // YYYY-MM-DD
}
function addDays(key, n) { const d = new Date(key + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dateLabel(key, long) {
  const d = new Date(key + "T12:00:00Z");
  return d.toLocaleDateString("en-US", { timeZone: "UTC", weekday: long ? "long" : "short", month: long ? "long" : "short", day: "numeric", year: long ? "numeric" : undefined });
}
function dateKey(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return new Date(Math.round((Math.floor(v) - 25569) * 864e5)).toISOString().slice(0, 10);
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  const m = String(v).match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[0];
  const d = new Date(String(v));
  return isNaN(d) ? null : d.toISOString().slice(0, 10);
}
function minutesOf(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return Math.round((v % 1) * 1440);
  const m = String(v).match(/(\d{1,2}):(\d{2})\s*([AP]M)?/i);
  if (!m) return null;
  let h = +m[1] % 12; if (m[3] && /p/i.test(m[3])) h += 12; if (!m[3]) h = +m[1];
  return h * 60 + +m[2];
}
function fmtTime(min) {
  if (min == null) return "TBD";
  const h = Math.floor(min / 60), m = min % 60;
  return `${((h + 11) % 12) + 1}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
}

/* tooltip */
const tip = el("div", { class: "tip", role: "tooltip" });
document.body.append(tip);
function showTip(e, head, lines) {
  tip.replaceChildren(el("div", { class: "tip-h", text: head }), ...lines.filter(Boolean).map(l => el("div", { text: l })));
  tip.style.display = "block"; moveTip(e);
}
function moveTip(e) {
  const pad = 14, r = tip.getBoundingClientRect();
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
function hideTip() { tip.style.display = "none"; }

/* ---------------------------------------------------------------- state */
const S = {
  loaded: false, file: null, teams: [], teamBy: new Map(), rows: [], byTeam: new Map(), games: new Map(), confs: [],
  date: null, dateConf: "", team: null, mA: null, mB: null, mSite: "neutral",
  rank: { sort: "adjNet", dir: -1, conf: "", q: "" },
  conf: null, roster: new Map(), rosterMeta: null,
  ats: { site: "Overall", conf: "", min: 3, sort: "coverPct", dir: -1 },

/* ---------------------------------------------------------------- parsing */
function sheetRows(wb, name, mustHave) {
  const key = wb.SheetNames.find(n => n.toLowerCase() === name.toLowerCase());
  if (!key) return null;
  const a = XLSX.utils.sheet_to_json(wb.Sheets[key], { header: 1, raw: true, defval: null, blankrows: false });
  const hi = a.findIndex((r, i) => i < 10 && r && r.some(c => str(c) === mustHave));
  if (hi < 0) return null;
  const hdr = a[hi].map(str);
  const out = [];
  for (let i = hi + 1; i < a.length; i++) {
    const r = a[i]; if (!r) continue;
    const o = {}; let any = false;
    hdr.forEach((h, j) => { if (h) { o[h] = r[j] ?? null; if (r[j] != null && r[j] !== "") any = true; } });
    if (any) out.push(o);
  }
  return out;
}

const TEAM_COLS = {
  name: ["Team", str], conf: ["Conference", str], rec: ["Record", str], w: ["W", num], l: ["L", num], winPct: ["Win %", num],
  confRec: ["Conf Record", str], confW: ["Conf W", num], confL: ["Conf L", num], confPct: ["Conf Win %", num],
  homeRec: ["Home Rec", str], homePM: ["Home +/-", num], awayRec: ["Away Rec", str], awayPM: ["Away +/-", num],
  neuRec: ["Neutral Rec", str], neuPM: ["Neutral +/-", num], best: ["Best Win", str], worst: ["Worst Loss", str],
  adjNet: ["Adj Net", num], netRk: ["Net Rk", num], srs: ["SRS", num], adjO: ["Adj O", num], oRk: ["O Rk", num],
  adjD: ["Adj D", num], dRk: ["D Rk", num], pace: ["Pace", num], efg: ["eFG%", num], oefg: ["Opp eFG%", num],
  to: ["TO%", num], oto: ["Opp TO%", num], orb: ["ORB%", num], oorb: ["Opp ORB%", num], games: ["Games", num], mascot: ["Mascot", str],
};
const GAME_COLS = {
  date: ["Date", dateKey], min: ["Time (ET)", minutesOf], team: ["Team", str], conf: ["Conference", str], site: ["Site", str],
  opp: ["Opponent", str], oppConf: ["Opp Conference", str], oppRating: ["Opp Rating", num], result: ["Result", str],
  pts: ["Pts", num], oppPts: ["Opp Pts", num], margin: ["Margin", num], score: ["Score", str], spread: ["Spread", num],
  openSpread: ["Open Spread", num], ats: ["ATS", str], ou: ["O/U", num], openOu: ["Open O/U", num], total: ["Game Total", num],
  ouRes: ["Over/Under", str], sd: ["Spread Difference", num], od: ["O/U Difference", num], ml: ["Moneyline", num], oml: ["Opp Moneyline", num],
  confGame: ["Conf Game", str], status: ["Status", str], type: ["Game Type", str], venue: ["Venue", str], city: ["City", str],
  state: ["State", str], id: ["GameID", v => v == null ? null : String(v)],
};
const pick = (row, cols) => { const o = {}; for (const [k, [h, fn]] of Object.entries(cols)) o[k] = fn(row[h]); return o; };

function gameFromRow(r) {
  const away = r.site === "Away";
  const flip = v => v == null ? null : (away ? -v : v);
  return {
    id: r.id, date: r.date, min: r.min,
    home: away ? r.opp : r.team, away: away ? r.team : r.opp,
    homeConf: away ? r.oppConf : r.conf, awayConf: away ? r.conf : r.oppConf,
    neutral: r.site === "Neutral", fromHome: r.site === "Home",
    spread: flip(r.spread), openSpread: flip(r.openSpread), ou: r.ou, openOu: r.openOu,
    homeMl: away ? r.oml : r.ml, awayMl: away ? r.ml : r.oml,
    final: r.result != null, homePts: away ? r.oppPts : r.pts, awayPts: away ? r.pts : r.oppPts,
    status: r.status, type: r.type, venue: r.venue, city: r.city, state: r.state, confGame: r.confGame === "Yes",
  };
}

function loadWorkbook(buf, meta) {
  const wb = XLSX.read(buf, { type: "array" });
  if (!wb.SheetNames.some(n => n.toLowerCase() === "all teams") && wb.SheetNames.some(n => n.toLowerCase() === "all players")) {
    const players = rosterFromWorkbook(wb);
    if (!players) throw new Error("That rosters file has no player list on its All Players tab.");
    setRoster(players, meta);
    store.put({ buf, meta }, "roster");
    return "roster";
  }
  const teamRows = sheetRows(wb, "All Teams", "Team");
  if (!teamRows) throw new Error('This file has no "All Teams" tab. Load college_basketball_by_conference.xlsx, the workbook your records script makes.');
  const gameRows = sheetRows(wb, "Games", "Team") || [];

  const teams = teamRows.map(r => pick(r, TEAM_COLS)).filter(t => t.name);
  const teamBy = new Map(teams.map(t => [t.name, t]));
  const rows = gameRows.map(r => pick(r, GAME_COLS)).filter(r => r.team);
  const byTeam = new Map();
  const games = new Map();
  for (const r of rows) {
    if (!byTeam.has(r.team)) byTeam.set(r.team, []);
    byTeam.get(r.team).push(r);
    const id = r.id || [r.date, ...[r.team, r.opp].sort()].join("|");
    const g = gameFromRow(r);
    const prev = games.get(id);
    if (!prev || (!prev.fromHome && g.fromHome)) games.set(id, { ...g, id });
  }
  for (const list of byTeam.values()) list.sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.min ?? 0) - (b.min ?? 0));
  S.teams = teams; S.teamBy = teamBy; S.rows = rows; S.byTeam = byTeam; S.games = games;
  S.confs = [...new Set(teams.map(t => t.conf).filter(Boolean))].sort();
  for (const t of teams) t.atsAll = atsSummary(byTeam.get(t.name) || []);
  buildPercentiles();
  S.lgO = avg(...teams.map(t => t.adjO)) ?? 105;
  S.lgD = avg(...teams.map(t => t.adjD)) ?? S.lgO;
  S.lgPace = avg(...teams.map(t => t.pace)) ?? 68;
  S.picks = (sheetRows(wb, "Picks", "Pick") || []).map(pickRow);
  S.pickLog = (sheetRows(wb, "Pick Log", "Pick") || []).map(pickRow);
  S.modelInfo = null;
  const mi = sheetRows(wb, "Model", "Parameter");
  if (mi) { S.modelInfo = {}; for (const r of mi) if (r.Parameter) S.modelInfo[String(r.Parameter)] = { value: r.Value, note: r.Note }; }
  S.file = meta; S.loaded = true;
  if (!S.team || !teamBy.has(S.team)) S.team = [...teams].sort((a, b) => (b.adjNet ?? -99) - (a.adjNet ?? -99))[0]?.name || null;
  if (!S.conf || !S.confs.includes(S.conf)) S.conf = null;
}

function pickRow(r) {
  return {
    date: dateKey(r["Date"]), min: (t => t == null ? null : t > 1 ? Math.round(t) : Math.round(t * 1440))(num(r["Time (ET)"])), id: r["GameID"] == null ? null : String(r["GameID"]),
    away: str(r["Away"]), home: str(r["Home"]), neutral: str(r["Neutral"]) === "Yes", type: str(r["Type"]), pick: str(r["Pick"]),
    side: str(r["Side"]), line: num(r["Line"]), modelLine: num(r["Model Line"]), edge: num(r["Edge"]), conf: num(r["Confidence"]),
    tier: str(r["Tier"]), flag: str(r["Flag"]), note: str(r["Note"]), modelMargin: num(r["Model Margin (Home)"]), modelTotal: num(r["Model Total"]), open: num(r["Open Line"]),
    result: str(r["Result"]), units: num(r["Units"]), close: num(r["Close Line"]), clv: num(r["CLV"]),
    homePts: num(r["Home Pts"]), awayPts: num(r["Away Pts"]),
  };
}

/* ---------------------------------------------------------------- rosters (name, #, position, class, height; no stats) */
function setRoster(players, meta) {
  const m = new Map();
  for (const p of players) {
    if (!p.team || !p.name) continue;
    if (!m.has(p.team)) m.set(p.team, []);
    m.get(p.team).push({ name: String(p.name), num: p.num == null ? null : String(p.num), pos: p.pos || null, cls: p.cls || null, ht: p.ht || null });
  }
  S.roster = m; S.rosterMeta = meta || null;
}
function rosterFromWorkbook(wb) {
  const rows = sheetRows(wb, "All Players", "Player");
  if (!rows) return null;
  return rows.map(r => ({ team: str(r["Team"]), name: str(r["Player"]), num: r["#"] == null ? null : String(r["#"]).replace(/\.0$/, ""), pos: str(r["Pos"]), cls: str(r["Class"]), ht: str(r["Ht"]) }));
}
function inches(ht) { const m = String(ht || "").match(/^(\d)\D+(\d{1,2})/); return m ? +m[1] * 12 + +m[2] : null; }
function rosterTable(team, sortState, onSort) {
  const players = S.roster.get(team) || [];
  if (!players.length) return el("p", { class: "muted", text: S.roster.size ? "No roster for this team in the rosters file." : "No rosters loaded. Add college_basketball_rosters_player_stats.xlsx to the data, or load that file here." });
  const order = { Fr: 1, So: 2, Jr: 3, Sr: 4, Gr: 5 };
  return sortTable({
    cols: [
      { key: "num", label: "#", r: true, get: p => p.num == null ? null : (isNaN(+p.num) ? p.num : +p.num) },
      { key: "name", label: "Player", get: p => p.name },
      { key: "pos", label: "Pos", get: p => p.pos },
      { key: "cls", label: "Class", get: p => order[p.cls] ?? null, fmt: (v, p) => p.cls || DASH },
      { key: "ht", label: "Height", r: true, get: p => inches(p.ht), fmt: (v, p) => p.ht || DASH },
    ],
    rows: players, sort: sortState, onSort, maxH: "none",
  });
}
function rosterSummary(team) {
  const hs = (S.roster.get(team) || []).map(p => inches(p.ht)).filter(v => v != null);
  if (!hs.length) return "";
  const a = hs.reduce((x, y) => x + y, 0) / hs.length, tall = Math.max(...hs);
  const fmtIn = v => `${Math.floor(v / 12)}-${Math.round(v % 12)}`;
  return `${hs.length} players · average height ${fmtIn(a)} · tallest ${fmtIn(tall)}`;
}

/* ---------------------------------------------------------------- derived numbers */
const PCT = [
  { k: "adjNet", label: "Adj Net", hi: true, fmt: fs1 }, { k: "adjO", label: "Adj Offense", hi: true, fmt: f1 },
  { k: "adjD", label: "Adj Defense", hi: false, fmt: f1 }, { k: "srs", label: "SRS", hi: true, fmt: fs1 },
  { k: "pace", label: "Pace", hi: true, fmt: f1, neutral: true },
  { k: "efg", label: "eFG%", hi: true, fmt: f1 }, { k: "oefg", label: "Opp eFG%", hi: false, fmt: f1 },
  { k: "to", label: "TO%", hi: false, fmt: f1 }, { k: "oto", label: "Opp TO%", hi: true, fmt: f1 },
  { k: "orb", label: "ORB%", hi: true, fmt: f1 }, { k: "oorb", label: "Opp ORB%", hi: false, fmt: f1 },
];
const PCT_BY = Object.fromEntries(PCT.map(p => [p.k, p]));
function buildPercentiles() { for (const p of PCT) p.sorted = S.teams.map(t => t[p.k]).filter(v => v != null).sort((a, b) => a - b); }
function lowerBound(a, v) { let lo = 0, hi = a.length; while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] < v) lo = m + 1; else hi = m; } return lo; }
function upperBound(a, v) { let lo = 0, hi = a.length; while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] <= v) lo = m + 1; else hi = m; } return lo; }
/** Share of D-I teams this value beats (0-1), respecting whether higher or lower is better. */
function percentile(k, v) {
  const p = PCT_BY[k]; if (v == null || !p || p.sorted.length < 2) return null;
  const a = p.sorted, n = a.length;
  const worse = p.hi ? lowerBound(a, v) : n - upperBound(a, v);
  return Math.min(1, Math.max(0, worse / (n - 1)));
}
function rankOf(k, v) {
  const p = PCT_BY[k]; if (v == null || !p) return null;
  const a = p.sorted;
  return p.hi ? a.length - upperBound(a, v) + 1 : lowerBound(a, v) + 1;
}
function ordinal(n) { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

/* ---------------------------------------------------------------- the model
   Projected points = team's Adj O x opponent's Adj D / D-I average, scaled to the
   expected possessions (pace x pace / average pace). Home court splits HCA points
   between the two sides. Probabilities treat the result as normally distributed
   around the projection (spread error SD and total error SD below). */
const MODEL_DEFAULTS = { hca: 3.0, sd: 11, sdTotal: 15, shrink: 0 };
S.model = (() => { try { return { ...MODEL_DEFAULTS, ...JSON.parse(localStorage.getItem("cbb-model") || "{}") }; } catch (e) { return { ...MODEL_DEFAULTS }; } })();
function saveModel() { try { localStorage.setItem("cbb-model", JSON.stringify(S.model)); } catch (e) { /* not saved */ } }
const BREAK_EVEN = 110 / 210; // win rate needed at -110
function phi(z) {
  const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z > 0 ? 1 - p : p;
}
function project(homeName, awayName, neutral) {
  const h = S.teamBy.get(homeName), a = S.teamBy.get(awayName);
  if (!h || !a || [h.adjO, h.adjD, a.adjO, a.adjD].some(v => v == null)) return null;
  const lgO = S.lgO || 105, lgD = S.lgD || lgO, lgP = S.lgPace || 68, k = 1 - (S.model.shrink || 0) / 100;
  const regO = v => lgO + (v - lgO) * k, regD = v => lgD + (v - lgD) * k;
  const poss = (h.pace ?? lgP) * (a.pace ?? lgP) / lgP;
  const hc = neutral ? 0 : S.model.hca / 2;
  // average offense vs average defense scores lgO points per 100 possessions
  const hp = regO(h.adjO) * regD(a.adjD) / lgD * poss / 100 + hc;
  const ap = regO(a.adjO) * regD(h.adjD) / lgD * poss / 100 - hc;
  return { hp, ap, margin: hp - ap, total: hp + ap, poss, winH: phi((hp - ap) / S.model.sd) };
}
function modelMargin(homeName, awayName, neutral) { const p = project(homeName, awayName, neutral); return p ? p.margin : null; }
const implied = ml => ml < 0 ? -ml / (-ml + 100) : 100 / (ml + 100);
/** Model vs market for one game. spread > 0 means the model likes the home side more than the line does. */
function edgesFor(g, p) {
  const o = { line: g.spread ?? g.openSpread, tl: g.ou ?? g.openOu };
  if (!p) return o;
  if (o.line != null) { o.spread = p.margin + o.line; o.spreadSide = o.spread >= 0 ? g.home : g.away; o.coverProb = phi(Math.abs(o.spread) / S.model.sd); }
  if (o.tl != null) { o.total = p.total - o.tl; o.totalSide = o.total >= 0 ? "Over" : "Under"; o.ouProb = phi(Math.abs(o.total) / S.model.sdTotal); }
  if (g.homeMl != null && g.awayMl != null) {
    const ih = implied(g.homeMl), ia = implied(g.awayMl);
    o.mktH = ih / (ih + ia); o.mlEdgeH = p.winH - o.mktH;
    o.mlSide = o.mlEdgeH >= 0 ? g.home : g.away; o.mlEdge = Math.abs(o.mlEdgeH);
  }
  return o;
}
/** Betting profile from games already played. */
function profile(name) {
  const all = (S.byTeam.get(name) || []).filter(r => r.result != null);
  const last = n => all.slice(-n);
  const form = rows => { const w = rows.filter(r => r.result === "W").length; return { rec: `${w}-${rows.length - w}`, margin: avg(...rows.map(r => r.margin)) }; };
  return {
    all: atsSummary(all), home: atsSummary(all.filter(r => r.site === "Home")), away: atsSummary(all.filter(r => r.site === "Away")),
    neutral: atsSummary(all.filter(r => r.site === "Neutral")),
    fav: atsSummary(all.filter(r => r.spread != null && r.spread < 0)), dog: atsSummary(all.filter(r => r.spread != null && r.spread > 0)),
    l5: atsSummary(last(5)), l10: atsSummary(last(10)), f5: form(last(5)),
    sos: avg(...all.map(r => r.oppRating)), n: all.length,
  };
}
function restDays(name, date) {
  if (!date) return null;
  const prev = (S.byTeam.get(name) || []).filter(r => r.date && r.date < date).pop();
  return prev ? Math.round((new Date(date + "T12:00:00Z") - new Date(prev.date + "T12:00:00Z")) / 864e5) : null;
}
const hasLines = s => s.c + s.m + s.p > 0;
function atsText(s, withPct = true) { return hasLines(s) ? s.atsRec + (withPct && s.coverPct != null ? ` (${fpct0(s.coverPct)})` : "") : DASH; }
function atsCell(s) {
  if (!hasLines(s)) return el("span", { class: "muted", text: DASH });
  const kind = s.coverPct >= 0.6 ? "good" : s.coverPct <= 0.4 ? "bad" : "even";
  return el("span", { class: "pill " + kind, title: s.coverPct != null ? `Covers ${fpct0(s.coverPct)}` : null, text: s.atsRec });
}
function edgeBar(points, max = 6) { return el("span", { class: "ebar", "aria-hidden": "true" }, el("i", { style: `width:${Math.min(100, Math.abs(points) / max * 100)}%` })); }

function atsSummary(rows) {
  const o = { g: 0, c: 0, m: 0, p: 0, sdSum: 0, sdN: 0, ov: 0, un: 0, op: 0, odSum: 0, odN: 0 };
  for (const r of rows) {
    if (r.result == null) continue;
    o.g++;
    if (r.ats === "Cover") o.c++; else if (r.ats === "Miss") o.m++; else if (r.ats === "Push") o.p++;
    if (r.sd != null) { o.sdSum += r.sd; o.sdN++; }
    if (r.ouRes === "Over") o.ov++; else if (r.ouRes === "Under") o.un++; else if (r.ouRes === "Push") o.op++;
    if (r.od != null) { o.odSum += r.od; o.odN++; }
  }
  o.coverPct = (o.c + o.m) ? o.c / (o.c + o.m) : null;
  o.overPct = (o.ov + o.un) ? o.ov / (o.ov + o.un) : null;
  o.sd = o.sdN ? o.sdSum / o.sdN : null;
  o.od = o.odN ? o.odSum / o.odN : null;
  o.atsRec = `${o.c}-${o.m}${o.p ? "-" + o.p : ""}`;
  o.ouRec = `${o.ov}-${o.un}${o.op ? "-" + o.op : ""}`;
  return o;
}

/** Sortable table. cols: {key, label, get(row), fmt(v,row)?, r?:right-align, cell(row)?:Node, title?} */
function sortTable({ cols, rows, sort, onSort, onRow, maxH }) {
  const col = cols.find(c => c.key === sort.key) || cols[0];
  const sorted = [...rows].sort((a, b) => {
    const x = col.get(a), y = col.get(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * sort.dir;
  });
  const thead = el("thead", null, el("tr", null, cols.map(c => el("th", {
    class: c.r ? "r" : "", scope: "col", title: c.title,
    "aria-sort": c.key === col.key ? (sort.dir > 0 ? "ascending" : "descending") : null,
  }, c.noSort ? c.label : el("button", { type: "button", onclick: () => onSort(c.key) }, c.label, c.key === col.key ? (sort.dir > 0 ? " ▲" : " ▼") : "")))));
  const tbody = el("tbody", null, sorted.map((r, i) => el("tr", { class: onRow ? "click" : "", onclick: onRow ? () => onRow(r) : null },
    cols.map(c => el("td", { class: c.r ? "r" : "" }, c.cell ? c.cell(r, i) : (c.fmt ? c.fmt(c.get(r), r) : (c.get(r) ?? DASH)))))));
  const wrap = el("div", { class: "tablewrap" }, el("table", null, thead, tbody));
  if (maxH) wrap.style.maxHeight = maxH;
  return wrap;
}
function toggleSort(state, key, defaultDir = -1) { if (state.sort === key) state.dir *= -1; else { state.sort = key; state.dir = defaultDir; } render(); }

const VIEWS = { picks: viewPicks, games: viewGames, model: viewModel, team: viewTeam, matchup: viewMatchup, rankings: viewRankings, conferences: viewConferences, ats: viewAts };

function scatter(box, conf) {

  for (let v = y0; v <= y1; v += 5) grid.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v) }), sv("text", { x: m.l - 6, y: Y(v) + 4, "text-anchor": "end", text: v }));

  const mx = med(xs), my = med(ys);

    sv("line", { x1: X(mx), x2: X(mx), y1: m.t, y2: H - m.b, stroke: "var(--muted)", "stroke-dasharray": "3 4", "stroke-width": 1 }),
    sv("line", { x1: m.l, x2: W - m.r, y1: Y(my), y2: Y(my), stroke: "var(--muted)", "stroke-dasharray": "3 4", "stroke-width": 1 }),
    sv("text", { x: W - m.r - 4, y: m.t + 12, "text-anchor": "end", text: "Good O · good D" }),
    sv("text", { x: m.l + 4, y: H - m.b - 6, text: "Weak O · weak D" }),

<script id="methods-view">
/* ================================================================ Picks tab: pick methods + day record sidebar */
/* CBB Hype - Picks tab with selectable pick methods.

(function () {

  const ABOUT = {
    "Model": "Team ratings vs the line. Confidence = how often the model's past disagreements with the line actually came true.",
    "Model + Trends": "The model, nudged up or down by trend factors (underdog size, home court, line movement; for totals: high/low totals and total movement).",
    "Trends": "Trend factors alone, no team ratings. Each factor's weight is learned from earlier games and pulled toward 50% until it proves itself.",
    "Torvik": "Torvik's projected score vs the line. Needs torvik_pull.py to run before the methods engine.",
    "Consensus": "A pick only when 2+ of Model, Trends and Torvik lean the same way at 52%+ and none leans the other way. Model + Trends doesn't vote because it overlaps the others.",
  };
  const LEAN = 0.545, STRONG = 0.57, PAYOUT = 100 / 110, PP = 25, AGREE = 0.52;
  const FACT = {
    Spread: [["dog_small", "Underdog of 0.5–3.5"], ["dog_mid", "Underdog of 4–9.5"], ["dog_big", "Underdog of 10+"],
             ["home", "Home team (not neutral)"], ["move", "Line moved toward this side (per 3 pts)"]],
    Total: [["lean", "Every game (overall lean; + = overs)"], ["high", "Total of 150+ (+ = overs)"], ["low", "Total under 135 (+ = overs)"],

      const homeP = r => r ? ((r.side === "home" || r.side === "over") ? r.conf : 1 - r.conf) : null;

  /* ---- day sidebar: the record for the selected date, kept in view while you scroll */

      const split = (label, list) => { const x = record(list); return h("div", null, h("span", { text: label }), h("span", { class: "num", text: recText(x) })); };

          h("ul", { class: "mv-list" }, order.map(r => h("li", null,
            resPill(["W", "L", "P"].includes(r.result) ? r.result : "Pending"),
            h("span", { class: "mv-pick" }, h("b", { text: r.pick }), h("small", { class: "muted" }, " · ", gameCell(r))),

          onclick: () => { UI.method = m; render(); }, onkeydown: e => { if (e.key === "Enter") { UI.method = m; render(); } } },
          h("span", { text: m }), h("span", { class: "num" + (x.n ? " mv-" + kind(x.units) : ""), text: recText(x) }));
      })));

    /* the original pick engine's picks for the same day */

  }
  function plural(k, w) { return `${k} ${w}${k === 1 ? "" : "s"}`; }
  if (!document.getElementById("mv-style")) document.head.append(h("style", { id: "mv-style", text: `

.mv-strip button.even { background: var(--even-bg); }

.mv-row { cursor: pointer; }
.mv-row:hover span:first-child, .mv-row.on span:first-child { color: var(--ink); font-weight: 600; }

  .mv-layout { grid-template-columns: 1fr; }
  .mv-side { position: static; max-height: none; order: -1; }
}` }));

  function gameCell(r) {
    const open = () => typeof goMatchup === "function" && goMatchup(r.away, r.home, r.neutral ? "neutral" : "b", r.id);
    return h("button", { class: "linkish", type: "button", onclick: open, text: `${r.away} ${r.neutral ? "vs" : "@"} ${r.home}` });
  }
  function confCell(c) {
    return h("span", null, pct(c), h("span", { class: "ebar", "aria-hidden": "true" }, h("i", { style: `width:${Math.min(100, Math.max(0, (c - 0.5) / 0.1 * 100))}%` })));
  }
  function scoreText(r) { return r.hp == null ? "" : `${r.ap}-${r.hp}`; }
  function singleTable(list) {

      h("thead", null, h("tr", null, ["Time", "Game", "Type", "Call", "Confidence", "Tier", "Result", "Score", "Units", "Detail"].map((c, i) => h("th", { class: [4, 8].includes(i) ? "r" : "", text: c })))),
      h("tbody", null, list.map(r => h("tr", null,
        h("td", { text: tfmt(r.min) }), h("td", null, gameCell(r)), h("td", { text: r.type }),
        h("td", { style: r.tier ? "font-weight:700" : "color:var(--muted)", text: r.pick }),
        h("td", { class: "r" }, confCell(r.conf)),
        h("td", null, r.tier ? pill(r.tier, r.tier === "Strong" ? "good" : "edge") : h("span", { class: "muted", text: "lean only" })),

    if (r.open != null && r.line != null && r.open !== r.line) bits.push(`opened ${r.type === "Spread" ? sgn(r.open) : r.open.toFixed(1)}`);

  function compareTable(day) {

    return h("div", { class: "tablewrap", style: "max-height:70vh" }, h("table", null,
      h("thead", null, h("tr", null, h("th", { text: "Game" }), h("th", { text: "Type" }), METHODS.map(m => h("th", { text: m })), h("th", { text: "Score" }))),
      h("tbody", null, list.map(g => h("tr", null, h("td", null, gameCell(g.base)), h("td", { text: g.base.type }),

        h("td", { text: scoreText(g.base) }))))));

  /* ---- trend weights panel */
  function trendPanel() {
    const man = M.manual;
    const det = h("details", { class: "settings", open: UI.trendOpen || null, ontoggle: e => { UI.trendOpen = e.target.open; } },

      manualOn() ? h("p", { class: "sub", style: "color:var(--bad)", text: "Heads up: manual weights are applied to past days too, using what you know now. If you tune them by looking at these records, the records will flatter your settings. Judge manual weights on games after you set them." }) : null,
      h("div", { class: "seg", role: "group", "aria-label": "Trend weight mode" },
        ["learned", "manual"].map(mode => h("button", { type: "button", "aria-pressed": String(man.mode === mode), text: mode === "learned" ? "Learned" : "Manual",
          onclick: () => { man.mode = mode; if (mode === "manual") seedManual(); saveManual(); render(); } }))));

      for (const [f, label] of FACT[type]) {

        const val = n(man[key][f]) ?? 0;
        const out = h("span", { class: "num", style: "min-width:52px;display:inline-block;text-align:right", text: sgn(val) + " pp" });
        const slider = h("input", { type: "range", min: "-10", max: "10", step: "0.5", value: String(val), disabled: !manualOn() || null, "aria-label": label, style: "width:140px",
          oninput: e => { out.textContent = sgn(+e.target.value) + " pp"; }, onchange: e => { man[key][f] = +e.target.value; saveManual(); render(); } });
        tbl.append(h("div", null, h("span", { text: label }),
          h("span", { style: "display:flex;gap:10px;align-items:center" }, h("span", { class: "muted num", text: `${lmt == null ? "—" : sgn(lmt)} / ${ltr == null ? "—" : sgn(ltr)}` }), slider, out)));
      }

    }

      h("button", { class: "btn", type: "button", text: "Copy learned weights into Manual", onclick: () => { seedManual(true); man.mode = "manual"; saveManual(); render(); } }),

  }

  if (S.loaded && typeof render === "function" && (location.hash === "#picks" || location.hash === "")) render();
})();
